services:
  bot:
    build: .
    container_name: janny_ai_bot
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - CLOAKBROWSER_CACHE_DIR=/app/.cache/cloakbrowser
      - CLOAKBROWSER_AUTO_UPDATE=false
      - DOWNLOAD_TIMEOUT_SECONDS=${DOWNLOAD_TIMEOUT_SECONDS:-3600}
      - DOWNLOAD_CONCURRENCY=${DOWNLOAD_CONCURRENCY:-1}
      - DATABASE_URL=${DATABASE_URL}
      - METRICS_HOST=${METRICS_HOST:-0.0.0.0}
      - METRICS_PORT=${METRICS_PORT:-8000}
    ports:
      - "${METRICS_HOST_PORT:-18001}:${METRICS_PORT:-8000}"
    restart: unless-stopped
    volumes:
      - .:/app
